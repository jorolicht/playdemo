@*
 * Template for bootstrap button
 *@
@import base.Messages.*
@import shared.DomTypes.HtmlId
@import cviews.helper.html.*

@(key: String, caption: String, bClass: String, enabledParam:Boolean=true)
<button @id(HtmlId(key), "onclick") type='button' class='btn @bClass' @enabled(enabledParam)>
  @caption
</button>
