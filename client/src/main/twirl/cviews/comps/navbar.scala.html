@import shared.DomTypes.HtmlId
@import cviews.helper.html.*
@import comps.Navbar.*
@import pages.*

@()
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary shadow-sm pt-0 pb-0">
    <div class="container-fluid">
        <!-- Navbar Brand -->
        <a class="navbar-brand ps-3" @exec(Home, "") style="display:none">
            <img src="@{base.Global.imgUrl}logo.png" alt="Logo" width="47" height="32" class="d-inline-block align-top">
        </a>
        
        <!-- Burger Icon for Mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbarContent" aria-controls="mainNavbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu Content -->
        <div class="collapse navbar-collapse" id="mainNavbarContent">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                
                <!-- Turnier Dropdown -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarTourney" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Turnier
                    </a>
                    <ul class="dropdown-menu shadow" aria-labelledby="navbarTourney">
                        <li><a class="dropdown-item" @exec(ViewOrganizer, "")>Suche</a></li>
                        <li><a class="dropdown-item" @exec(TourneyNew, "")>Neu</a></li>
                    </ul>
                </li>

                <!-- Wettbewerbe Dropdown -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarComps" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Wettbewerbe
                    </a>
                    <ul class="dropdown-menu shadow" aria-labelledby="navbarComps">
                        <li><a class="dropdown-item" onclick="appLoadPage('TourneyInfo', '')">Auswahl</a></li>
                    </ul>
                </li>

                <!-- Ergebnisse -->
                <li class="nav-item">
                    <a class="nav-link" onclick="appLoadPage('ResultList', '')">Ergebnisse</a>
                </li>

            </ul>

            <!-- Right side: User Profile / Console -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 me-3" style="display:none">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-user fa-fw"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="navbarDropdown">
                        <li><a @id(ShowLoginId, "onclick") class="dropdown-item">@gM("app.btn.login")</a></li>
                        <li><a @id(DoLogoutId, "onclick")  class="dropdown-item">@gM("app.btn.logout")</a></li>
                        <li><hr class="dropdown-divider" /></li>
                        <li><a @id(ConsoleClickId, "onclick") class="dropdown-item">@gM("app.btn.console")</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
