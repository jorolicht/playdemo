@()
@import comps.Footer.*
<footer class="footer mt-auto py-4 bg-light border-top">
    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-3 mb-md-0">
                <h6 class="fw-bold">TurnierService</h6>
                <p class="small text-muted">@gM("footer.tagline")</p>
            </div>
            <div class="col-md-8 text-md-end">
                <ul class="list-inline mb-0">
                    <li class="list-inline-item me-3"><a href="javascript:appLoadPage('MainView', 'impressum')" class="text-decoration-none text-muted small">@gM("footer.impressum")</a></li>
                    <li class="list-inline-item me-3"><a href="javascript:appLoadPage('MainView', 'privacy')" class="text-decoration-none text-muted small">@gM("footer.privacy")</a></li>
                    <li class="list-inline-item me-3"><a href="javascript:appLoadPage('MainView', 'contact')" class="text-decoration-none text-muted small">@gM("footer.contact")</a></li>
                    <li class="list-inline-item"><a href="javascript:appLoadPage('MainView', 'gtc')" class="text-decoration-none text-muted small">@gM("footer.gtc")</a></li>
                </ul>
                <div class="mt-2 text-muted" style="font-size: 0.75rem;">
                    <a href="javascript:startConsole()" class="text-decoration-none text-muted">&copy;</a> 2026 TurnierService. @gM("footer.realizedWith")
                </div>
            </div>
        </div>
    </div>
</footer>
