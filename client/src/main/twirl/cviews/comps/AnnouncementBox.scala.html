@import shared.model.Announcement
@import base.Messages.gM

@* Kasten mit den Durchsagen der Turnierleitung für Spieler („Mein Turnier“); ohne Durchsagen nichts *@
@(list: Seq[Announcement])

@if(list.nonEmpty) {
    <div class="alert alert-warning border-0 shadow-sm rounded-4 mb-3" data-testid="my-announcements">
        <div class="fw-bold mb-1"><i class="bi bi-megaphone-fill me-2"></i>@gM("announce.title")</div>
        @AnnouncementList(list)
    </div>
}
