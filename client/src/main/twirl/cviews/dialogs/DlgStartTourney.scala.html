@import shared.DomTypes.HtmlId
@import cviews.helper.html.*
@import dialogs.DlgStartTourney.*
@import base.Messages.gM

@()

<div class="modal fade" @id(ModalId) tabindex="-1" @ariaLabelledBy(TitleId) aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0 rounded-3">
            <div class="modal-header bg-primary text-white py-3">
                <h5 class="modal-title fw-bold" @id(TitleId)>
                    <i class="bi bi-trophy me-2"></i>@gM("dlg.startTourney.title")
                </h5>
                <button type="button" class="btn-close btn-close-white" @id(CloseId) data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <p class="text-secondary mb-0 fw-medium" @id(PromptId)>
                    @gM("dlg.startTourney.text")
                </p>
            </div>
            <div class="modal-footer bg-light d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-outline-secondary" @id(CancelId) data-bs-dismiss="modal">
                    @gM("dlg.startTourney.btnCancel")
                </button>
                <button type="button" class="btn btn-primary fw-bold px-3" @id(ApplyId)>
                    <i class="bi bi-play-fill me-1"></i>@gM("dlg.startTourney.btnStart")
                </button>
            </div>
        </div>
    </div>
</div>
