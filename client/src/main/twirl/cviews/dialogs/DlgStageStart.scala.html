@import shared.model.*
@import dialogs.DlgStageStart.*
@import cviews.helper.html.*

@(stages: Seq[Stage])

<div class="modal fade" @id(ModalId) tabindex="-1" @ariaLabelledBy(StartLabelId) aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" @id(StartLabelId)>@gM("DlgStageStart.title")</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" @id(CloseId)></button>
            </div>
            <div class="modal-body">
                <form @id(FormId) onsubmit="return false;">
                    <div class="mb-3">
                        <label @forAttr(InputNameId) class="form-label fw-bold">@gM("DlgStageStart.name_label")</label>
                        <input type="text" class="form-control" @id(InputNameId) placeholder="@gM("DlgStageStart.name_placeholder")" required>
                    </div>

                    @if(stages.nonEmpty) {
                        <div class="mb-3">
                            <label @forAttr(InputPrefId) class="form-label fw-bold">@gM("DlgStageStart.pref_label")</label>
                            <select class="form-select" @id(InputPrefId)>
                                <option value="0">@gM("DlgStageStart.pref_placeholder")</option>
                                @stages.map { r =>
                                    <option value="@r.id.value">@r.name (@r.status)</option>
                                }
                            </select>
                        </div>
                    } else {
                        <input type="hidden" @id(InputPrefId) value="0">
                        <div class="alert alert-info py-2 small">
                            <i class="bi bi-info-circle me-2"></i>@gM("DlgStageStart.start_notice")
                        </div>
                    }
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" @id(CancelId)>@gM("DlgStageStart.cancel")</button>
                <button type="button" class="btn btn-primary" @id(ApplyId)>@gM("DlgStageStart.start")</button>
            </div>
        </div>
    </div>
</div>
