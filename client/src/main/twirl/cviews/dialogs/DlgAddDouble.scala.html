@import shared.model.*
@import dialogs.DlgAddDouble.*
@import cviews.helper.html.*

@(players: Seq[Player], clubs: Seq[Club])

<div class="modal fade" @id(ModalId) tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Doppel hinzufügen</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" @id(CloseId)></button>
            </div>
            <div class="modal-body">
                <form @id(FormId) onsubmit="return false;">
                    <div class="mb-3">
                        <label @forAttr(InputP1Id) class="form-label small fw-bold">1. Spieler</label>
                        <input type="text" class="form-control" @id(InputP1Id) list="@Plist1Id.id" placeholder="Suche Name, Vorname..." required>
                        <datalist @id(Plist1Id)>
                            @players.map { p =>
                                <option value="@p.lastName, @p.firstName [@{clubs.find(_.id.toInt == p.clubId).map(_.name).getOrElse("?")}]" data-id="@p.id">
                            }
                        </datalist>
                    </div>

                    <div class="mb-3">
                        <label @forAttr(InputP2Id) class="form-label small fw-bold">2. Spieler</label>
                        <input type="text" class="form-control" @id(InputP2Id) list="@Plist2Id.id" placeholder="Suche Name, Vorname..." required>
                        <datalist @id(Plist2Id)>
                            @players.map { p =>
                                <option value="@p.lastName, @p.firstName [@{clubs.find(_.id.toInt == p.clubId).map(_.name).getOrElse("?")}]" data-id="@p.id">
                            }
                        </datalist>
                    </div>

                    <div class="bg-light p-3 rounded border mb-3">
                        <label class="form-label d-block small fw-bold mb-2">Aktion</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="DlgAddDouble-action" @id(RadioRegId) value="reg">
                            <label class="form-check-label small" @forAttr(RadioRegId)>Nur Registrieren (Inaktiv)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="DlgAddDouble-action" @id(RadioPlayId) value="play" checked>
                            <label class="form-check-label small" @forAttr(RadioPlayId)>Registrieren und Anmelden (Aktiv)</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" @id(CancelId)>Abbrechen</button>
                <button type="button" class="btn btn-primary" @id(ApplyId)>Speichern</button>
            </div>
        </div>
    </div>
</div>

<div @id(LoadId) data-loaded="false"></div>
