@import shared.DomTypes.HtmlId
@import cviews.helper.html.*
@import dialogs.DlgTourneyNewMode.*
@import base.Messages.gM

@(isLoggedIn: Boolean, defaultLocal: Boolean)

<div class="modal fade" @id(ModalId) tabindex="-1" @ariaLabelledBy(TitleId) aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0 rounded-3">
            <div class="modal-header bg-primary text-white py-3">
                <h5 class="modal-title fw-bold" @id(TitleId)>
                    <i class="bi bi-plus-circle me-2"></i>@gM("tourneyNew.dlgTitle")
                </h5>
                <button type="button" class="btn-close btn-close-white" @id(CloseId) data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <p class="text-secondary mb-3 fw-medium">
                    @gM("tourneyNew.dlgSubtitle")
                </p>
                <div class="list-group">
                    <label class="list-group-item list-group-item-action d-flex align-items-start gap-3 p-3 border rounded mb-2">
                        <input class="form-check-input flex-shrink-0 mt-1" type="radio" name="tourneyTargetMode" @id(RadioLocalId) value="local" @if(defaultLocal || !isLoggedIn){checked}>
                        <div>
                            <div class="fw-bold text-dark mb-1">
                                <i class="bi bi-laptop me-1 text-primary"></i>@gM("tourneyNew.createLocal")
                            </div>
                            <small class="text-muted d-block">
                                @gM("tourneyNew.createLocalDesc")
                            </small>
                        </div>
                    </label>
                    <label class="list-group-item list-group-item-action d-flex align-items-start gap-3 p-3 border rounded @if(!isLoggedIn){bg-light opacity-75}">
                        <input class="form-check-input flex-shrink-0 mt-1" type="radio" name="tourneyTargetMode" @id(RadioCloudId) value="cloud" @if(!defaultLocal && isLoggedIn){checked} @if(!isLoggedIn){disabled}>
                        <div>
                            <div class="fw-bold @if(isLoggedIn){text-dark}else{text-muted} mb-1">
                                <i class="bi bi-cloud-arrow-up me-1 @if(isLoggedIn){text-primary}else{text-secondary}"></i>@gM("tourneyNew.createCloud")
                                @if(!isLoggedIn) {
                                    <span class="badge bg-secondary ms-2 small">@gM("tourneyNew.cloudLoginRequired")</span>
                                }
                            </div>
                            <small class="text-muted d-block">
                                @gM("tourneyNew.createCloudDesc")
                            </small>
                        </div>
                    </label>
                </div>
            </div>
            <div class="modal-footer bg-light d-flex justify-content-between">
                <button type="button" class="btn btn-outline-secondary" @id(CancelId) data-bs-dismiss="modal">
                    @gM("dlg.comp.btnCancel")
                </button>
                <button type="button" class="btn btn-primary fw-bold px-4" @id(ApplyId)>
                    <i class="bi bi-check-lg me-1"></i>@gM("tourneyNew.btnCreate")
                </button>
            </div>
        </div>
    </div>
</div>
