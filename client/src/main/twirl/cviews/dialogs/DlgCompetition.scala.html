@import dialogs.DlgCompetition.*
@import cviews.helper.html.*
@import shared.model.CompTyp
@import shared.model.CompCategory

@()

<div class="modal fade" @id(ModalId) tabindex="-1" aria-labelledby="DlgCompetition-label" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="DlgCompetition-label" @id(TitleId)>@gM("dlg.comp.title")</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" @id(CloseId)></button>
            </div>
            <div class="modal-body">
                <form onsubmit="return false;">
                    
                    <div class="mb-3">
                        <label @forAttr(CompCategoryId) class="form-label fw-bold">@gM("dlg.comp.category")</label>
                        <select class="form-select border-primary" @id(CompCategoryId)>
                            @CompCategory.values.map { c =>
                                <option value="@c.toString">@c.toString</option>
                            }
                        </select>
                    </div>

                    <div class="mb-3">
                        <label @forAttr(CompNameId) class="form-label">@gM("dlg.comp.name")</label>
                        <input type="text" class="form-control" @id(CompNameId) placeholder="@gM("dlg.comp.namePlh")" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label @forAttr(CompTypId) class="form-label">@gM("dlg.comp.type")</label>
                            <select class="form-select" @id(CompTypId)>
                                @CompTyp.values.filter(_ != CompTyp.Typ).map { t =>
                                    <option value="@t.toString" @if(t == CompTyp.SINGLE){selected}>@t.toString</option>
                                }
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label @forAttr(StartDateId) class="form-label">@gM("dlg.comp.start")</label>
                            <input type="datetime-local" class="form-control" @id(StartDateId) required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label @forAttr(TtrFromId) class="form-label">@gM("dlg.comp.ttrFrom")</label>
                            <input type="number" class="form-control" @id(TtrFromId) placeholder="0">
                        </div>
                        <div class="col-md-6">
                            <label @forAttr(TtrToId) class="form-label">@gM("dlg.comp.ttrTo")</label>
                            <input type="number" class="form-control" @id(TtrToId) placeholder="3000">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" @id(CancelId)>@gM("dlg.comp.btnCancel")</button>
                <button type="button" class="btn btn-success" @id(ApplyId)>@gM("dlg.comp.btnCreate")</button>
            </div>
        </div>
    </div>
</div>

<div @id(LoadId) data-loaded="false"></div>
