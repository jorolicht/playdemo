@*
 * Template for chat example
 *@
@import pages.ChatExample.*
@import cviews.helper.html.* 
@import shared.model.User

@(user: User)

<div class="card mt-4">
    <div class="card-body">
      <h5 class="card-title">@gM("+title.UserId", user.id.toString)</h5>
      <div class="card mt-4">
        <div class="card-body">
          <h5 class="card-title">@gM("+title.SendMsg")</h5>
            <div class="col-5">
            <div class="input-group mb-2">
              <span class="input-group-text">@gM("+lbl.Rcv")</span>
              <input type="text" class="form-control" @plh2("RcvIdExample")>
            </div>
            </div>
            <div class="input-group mb-2">
              <span class="input-group-text">@gM("+lbl.Msg")</span>
              <input type="text" class="form-control" @plh2("sendMsgExample")>
              <button @id2(sendId) class="btn btn-outline-secondary" type="button">@gM("+btn.send")</button>  
            </div>
        </div>
      </div>      

      <div class="card mt-4">
        <div class="card-body">
          <h5 class="card-title">@gM("+title.RcvMsgs")</h5>
            <div class="input-group mb-2">
              <textarea class="form-control" @id2(rcvMsgsId) rows="6"></textarea>
            </div>
        </div>
      </div> 
    </div>
</div>
