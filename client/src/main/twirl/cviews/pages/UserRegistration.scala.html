@import pages.UserRegistration.*
@import cviews.helper.html.*

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Neuen Account erstellen</h4>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Anzeigename</label>
                        <input @id(NameId) type="text" class="form-control" placeholder="Max Mustermann">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-Mail Adresse</label>
                        <input @id(EmailId) type="email" class="form-control" placeholder="name@@beispiel.de">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Passwort (min. 8 Zeichen)</label>
                        <input @id(PasswordId) type="password" class="form-control">
                    </div>
                    
                    <div class="form-check form-switch mb-3">
                        <input @id(IsAdminCheck, "onchange") class="form-check-input" type="checkbox">
                        <label class="form-check-label">Ich möchte Turniere verwalten (Turnier-Admin)</label>
                    </div>

                    <div class="mb-3 d-none">
                        <label class="form-label">Veranstalter / Verein (min. 6 Zeichen)</label>
                        <input @id(OrganizerId) type="text" class="form-control" placeholder="TTC Beispielstadt">
                    </div>

                    <hr>
                    <button @id(BtnSubmit, "onclick") class="btn btn-success w-100">
                        Registrieren & Verifizierungsemail senden
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
