@import pages.UserRegistration.*
@import cviews.helper.html.*
@import base.Messages.gM

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">@gM("reg.title")</h4>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">@gM("reg.email")</label>
                        <input @id(EmailId) type="email" class="form-control" placeholder="name@@beispiel.de">
                    </div>

                    <!-- Passwordless Toggle Switch -->
                    <div class="form-check form-switch mb-3">
                        <input @id(PasswordlessSwitch, "onchange") class="form-check-input" type="checkbox" checked>
                        <label class="form-check-label fw-bold">Passwortlose Registrierung</label>
                        <div class="form-text text-muted small">Sie erhalten einen Verifizierungslink per E-Mail und können sich danach per E-Mail-Link oder Passkey anmelden.</div>
                    </div>

                    <!-- Optional Password Field (Hidden by default when Passwordless is checked) -->
                    <div @id(PasswordContainer) class="mb-3 d-none">
                        <label class="form-label">@gM("reg.password")</label>
                        <input @id(PasswordId) type="password" class="form-control" placeholder="Mindestens 8 Zeichen">
                    </div>
                    
                    <div class="form-check form-switch mb-3">
                        <input @id(IsAdminCheck, "onchange") class="form-check-input" type="checkbox">
                        <label class="form-check-label">@gM("reg.isAdmin")</label>
                    </div>

                    <div class="mb-3 d-none">
                        <label class="form-label">@gM("reg.organizer")</label>
                        <input @id(OrganizerId) type="text" class="form-control" placeholder="TTC Beispielstadt">
                    </div>

                    <!-- Optional: Cloudflare Turnstile -->
                    @if(base.Global.turnstileSitekey.nonEmpty) {
                        <div class="cf-turnstile mb-3 d-flex justify-content-center" data-sitekey="@base.Global.turnstileSitekey"></div>
                    }

                    <hr>
                    <button @id(BtnSubmit, "onclick") class="btn btn-success w-100">
                        @gM("reg.btnSubmit")
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
