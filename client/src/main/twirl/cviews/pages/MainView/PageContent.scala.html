@(title: String, content: String)
<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-4 bg-light p-2 rounded shadow-sm">
        <li class="breadcrumb-item"><a href="javascript:appLoadPage('MainView', '')" class="text-decoration-none"><i class="bi bi-house-door me-1"></i>Startseite</a></li>
        <li class="breadcrumb-item active" aria-current="page">@title</li>
      </ol>
    </nav>
    <div class="card shadow-lg border-0 overflow-hidden">
        <div class="card-header bg-white border-0 pt-4 px-md-5">
             <h1 class="display-5 fw-bold text-primary mb-0">@title</h1>
        </div>
        <div class="card-body p-md-5 pt-3">
            <div class="wp-content-body lh-lg">
                @Html(content)
            </div>
        </div>
        <div class="card-footer bg-light border-0 py-3 px-md-5 text-end">
            <button class="btn btn-outline-secondary btn-sm" onclick="appLoadPage('MainView', '')">Zurück</button>
        </div>
    </div>
</div>
