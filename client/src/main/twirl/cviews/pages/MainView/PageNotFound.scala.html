@(identifier: String, msgCode: String)
<div class="container mt-5 text-center">
    <div class="alert alert-warning py-5 shadow-sm">
        <i class="bi bi-exclamation-octagon display-1 text-warning mb-3"></i>
        <h2 class="fw-bold">Seite nicht gefunden</h2>
        <p class="text-muted fs-5">Die angeforderte Seite ('@identifier') konnte nicht geladen werden oder existiert nicht.</p>
        <p class="small text-muted">Details: @msgCode</p>
        <hr class="my-4 mx-auto w-25">
        <button class="btn btn-primary mt-2 px-5 py-2 fw-bold" onclick="appLoadPage('MainView', '')">
            <i class="bi bi-arrow-left me-2"></i>Zurück zur Startseite
        </button>
    </div>
</div>
