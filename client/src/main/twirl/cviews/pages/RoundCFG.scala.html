@import shared.model.*

@(round: Round, participants: Seq[Pant])

<div class="card shadow-sm">
    <div class="card-body">
        <h5 class="card-title mb-4 border-bottom pb-2 text-secondary">Rundenkonfiguration: @round.name</h5>
        
        <div class="row g-4">
            <!-- Left: Settings -->
            <div class="col-md-6">
                <div class="p-3 border rounded bg-light h-100">
                    <h6 class="fw-bold mb-3"><i class="bi bi-sliders me-2"></i>Parameter</h6>
                    <div class="mb-3">
                        <label class="form-label">Spielmodus</label>
                        <select class="form-select">
                            <option @{if(round.rndCfg.typ == RoundTyp.GR) "selected" else ""}>Gruppensystem</option>
                            <option @{if(round.rndCfg.typ == RoundTyp.KO) "selected" else ""}>KO-System</option>
                            <option @{if(round.rndCfg.typ == RoundTyp.SW) "selected" else ""}>Schweizer System</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Gewinnsätze</label>
                        <input type="number" class="form-control" value="@round.noWinSets">
                    </div>
                </div>
            </div>

            <!-- Right: Players -->
            <div class="col-md-6">
                <div class="p-3 border rounded bg-light h-100">
                    <h6 class="fw-bold mb-3"><i class="bi bi-person-check me-2"></i>Teilnehmerauswahl</h6>
                    <div class="list-group list-group-flush border rounded bg-white overflow-auto" style="max-height: 250px;">
                        @if(participants.isEmpty) {
                            <div class="p-3 text-center text-muted italic">Keine Teilnehmer im Wettbewerb.</div>
                        }
                        @participants.map { p =>
                            <label class="list-group-item">
                                <input class="form-check-input me-2" type="checkbox" @{if(p.status == PantStatus.PLAY) "checked" else ""}>
                                @p.name (@p.club)
                                <span class="badge bg-light text-dark float-end border">@p.rating</span>
                            </label>
                        }
                    </div>
                    <div class="mt-2 small text-muted">Verfügbar: @participants.length Spieler</div>
                </div>
            </div>
        </div>

        <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
            <button class="btn btn-outline-danger">
                <i class="bi bi-arrow-counterclockwise me-1"></i>RESET
            </button>
            <button class="btn btn-primary px-4" onclick="appLoadPage('RoundDRW', '')">
                <i class="bi bi-shuffle me-1"></i>START AUSLOSUNG
            </button>
        </div>
    </div>
</div>
