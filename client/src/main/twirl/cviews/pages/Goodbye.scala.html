@import base.Messages.gM

@()

<div class="container mt-5 py-5 text-center goodbye-view">
    <div class="goodbye-card mx-auto p-5 rounded-4 shadow-lg border-0 bg-white" style="max-width: 600px; position: relative; overflow: hidden;">
        <!-- Animated Background Gradient Effect -->
        <div class="goodbye-gradient-bg"></div>

        <div class="goodbye-content" style="position: relative; z-index: 2;">
            <div class="mb-4">
                <div class="icon-circle bg-success bg-gradient text-white mx-auto rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 80px; height: 80px;">
                    <i class="bi bi-box-arrow-left display-4"></i>
                </div>
            </div>
            
            <h1 class="display-5 fw-bold text-dark mb-3">@gM("goodbye.title")</h1>
            <p class="lead text-muted mb-4 fs-5">@gM("goodbye.subtitle")</p>
            
            <div class="p-3 bg-light rounded-3 mb-4 text-start shadow-sm border border-light-subtle">
                <p class="small text-muted mb-0 lh-lg">
                    <i class="bi bi-info-circle-fill text-primary me-2"></i>@gM("goodbye.info")
                </p>
            </div>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <button class="btn btn-primary btn-lg px-4 gap-3 fw-bold shadow-sm hover-lift" onclick="appLoadPage('UserLogin', '')">
                    <i class="bi bi-box-arrow-in-right me-2"></i>@gM("login.title")
                </button>
                <button class="btn btn-outline-secondary btn-lg px-4 fw-bold hover-lift" onclick="appLoadPage('MainView', '')">
                    <i class="bi bi-house-door me-2"></i>@gM("breadcrumb.home")
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .goodbye-view {
        animation: fadeIn 0.6s ease-out;
    }
    .goodbye-card {
        border: 1px solid rgba(0,0,0,0.05);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .goodbye-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 1.5rem 3rem rgba(0,0,0,0.15) !important;
    }
    .goodbye-gradient-bg {
        position: absolute;
        top: -50%; left: -50%; right: -50%; bottom: -50%;
        background: radial-gradient(circle, rgba(13,110,253,0.03) 0%, rgba(25,135,84,0.02) 50%, rgba(255,255,255,0) 100%);
        z-index: 1;
        pointer-events: none;
        animation: rotateBg 20s linear infinite;
    }
    .icon-circle {
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .goodbye-card:hover .icon-circle {
        transform: scale(1.1) rotate(-10deg);
    }
    .hover-lift {
        transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }
    .hover-lift:hover {
        transform: translateY(-2px);
    }
    @@keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @@keyframes rotateBg {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
</style>
