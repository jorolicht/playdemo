@import shared.model.*
@import pages.Stage.StageDraw.*

@(stage: Stage)

<div class="card shadow-sm">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h5 class="card-title text-secondary mb-0">
                <i class="bi bi-shuffle me-2"></i>@gM("+title", stage.name)
            </h5>
            <button class="btn btn-outline-danger btn-sm d-print-none" onclick="appLoadPage('StageAdmin', '')">
                <i class="bi bi-arrow-left me-1"></i>@gM("+btn_back_overview")
            </button>
        </div>
        <div class="text-center py-5 text-muted italic">
            @gM("+no_draw")
        </div>
    </div>
</div>
