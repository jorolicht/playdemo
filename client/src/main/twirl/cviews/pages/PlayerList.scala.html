@import shared.model.*

@(competitions: Seq[Competition])

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h3 class="h5 mb-0"><i class="bi bi-people me-2"></i>Teilnehmer-Übersicht</h3>
        </div>
        <div class="card-body p-0">
            <div class="accordion accordion-flush" id="playerAccordion">
                @if(competitions.isEmpty) {
                    <div class="p-4 text-center text-muted italic">Keine Wettbewerbe angelegt.</div>
                }
                @competitions.map { c =>
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePlayer@c.id.value">
                                <div class="d-flex justify-content-between w-100 me-3">
                                    <span><strong>Wettbewerb:</strong> @c.name</span>
                                    <span class="badge bg-secondary rounded-pill">@c.pants.length Spieler</span>
                                </div>
                            </button>
                        </h2>
                        <div id="collapsePlayer@c.id.value" class="accordion-collapse collapse" data-bs-parent="#playerAccordion">
                            <div class="accordion-body p-0">
                                <div class="bg-light p-2 d-flex justify-content-end gap-2 border-bottom">
                                    <button class="btn btn-outline-primary btn-sm" @if(!base.Global.hasTourneyAccess(services.TourneyDB.tourney)){disabled}><i class="bi bi-person-plus me-1"></i>Hinzufügen</button>
                                    <button class="btn btn-outline-secondary btn-sm" @if(!base.Global.hasTourneyAccess(services.TourneyDB.tourney)){disabled}><i class="bi bi-file-earmark-spreadsheet me-1"></i>CSV Upload</button>
                                </div>
                                <table class="table table-sm table-hover mb-0">
                                    <thead class="table-light small">
                                        <tr>
                                            <th class="ps-4">Name, Vorname</th>
                                            <th>Verein</th>
                                            <th class="text-center">TTR</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        @if(c.pants.isEmpty) {
                                            <tr><td colspan="3" class="text-center py-3 text-muted italic">Keine Teilnehmer angemeldet.</td></tr>
                                        }
                                        @c.pants.map { p =>
                                            <tr>
                                                <td class="ps-4">@p.name</td>
                                                <td>@p.club</td>
                                                <td class="text-center">@p.rating</td>
                                            </tr>
                                        }
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
