# prefork MPM (eingebunden über docker-compose.yml, ersetzt die Datei des Images)
# StartServers: number of server processes to start
# MinSpareServers: minimum number of server processes which are kept spare
# MaxSpareServers: maximum number of server processes which are kept spare
# MaxRequestWorkers: maximum number of server processes allowed to start
# MaxConnectionsPerChild: maximum number of requests a server process serves
#
# MaxRequestWorkers kommt aus APACHE_MAX_WORKERS (.env, Standard 12 in docker-compose.yml): Ein Apache-Prozess
# braucht ca. 60-70 MB; auf einem Server mit 1,8 GB RAM ohne Swap würden 150 Prozesse den Speicher erschöpfen
# (Lasttest 25.11.2026, doc/Lasttest.md). Überzählige Anfragen warten, statt den Server abstürzen zu lassen.

StartServers            5
MinSpareServers         5
MaxSpareServers         10
MaxRequestWorkers       ${APACHE_MAX_WORKERS}
MaxConnectionsPerChild  0
