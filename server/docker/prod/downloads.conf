# Öffentlicher Download-Bereich (Service "downloads"), erreichbar unter /downloads/
# Inhalt: server/docker/<env>/downloads, befüllt durch "sbt publishWpPlugin"
server {
    listen 80;
    root /usr/share/nginx/html;
    # Weiterleitung /downloads -> /downloads/ relativ, da TLS am Reverse-Proxy endet
    absolute_redirect off;

    location = /downloads {
        return 301 /downloads/;
    }

    # Versteckte Dateien (z. B. .gitkeep) nicht ausliefern
    location ~ /\. {
        return 404;
    }

    location /downloads/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Der feste Alias zeigt nach jedem Release auf eine neue Datei: nicht cachen
    location ~ ^/downloads/.+-latest\.zip$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
