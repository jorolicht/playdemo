name: ${APP_NAME}

services:
  # Reverse Proxy (Traefik), der den HTTPS-Traffic (Port 443) verwaltet
  reverse-proxy:
    image: traefik:v3.6.2
    command:
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
    
      # 1. Entrypoints definieren
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    
      # 2. Globale Weiterleitung von Port 80 (web) nach Port 443 (websecure) einrichten
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    
      - "--providers.file.filename=/etc/traefik/dynamic_config.toml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /Users/robert/.docker/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/traefik/certs:ro
      - ./dynamic_config.toml:/etc/traefik/dynamic_config.toml:ro
    networks:
      - proxy

  wordpress:
    image: wp-gmp-image
    build:
      context: .
      dockerfile: wordpress/Dockerfile
    container_name: wp-gmp-instance
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'https://localhost' );
        define( 'WP_SITEURL', 'https://localhost' );
        define( 'PLAY_SERVER_URL', "${PLAY_SERVER_URL}" );

    expose:
      - "80"
    volumes:
      - ./wp_data:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      # Reagiert auf alle Hosts (Standard-Pfad /)
      - "traefik.http.routers.wordpress.rule=PathPrefix(`/`)"
      - "traefik.http.routers.wordpress.tls=true"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
      # KORREKTUR: Netzwerk-Name korrigiert von 'web' zu 'proxy'
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - backend

  wp-cli:
    image: wordpress:cli
    container_name: wp-cli-instance
    user: root
    volumes:
      - ./wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    depends_on:
      - db
    networks:
      - backend
    command: tail -f /dev/null

  db:
    image: mariadb:10.11
    container_name: wp-db-instance
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - backend

  playsrv:
    image: playsrv-image
    container_name: playsrv-instance
    build:
      context: .
      dockerfile: playsrv/Dockerfile
      args:
        - APP_HOME=${APP_HOME}
        - PLAY_WP_URL=${PLAY_WP_URL}
        - PLAY_WP_CPT=${PLAY_WP_CPT}
        - APP_VERSION=${APP_VERSION}
        - DEMON_USER=${DEMON_USER}
        - DEMON_USERID=${DEMON_USERID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.playsrv.entrypoints=websecure"
      # Pfadbasiertes Routing für alle Hosts
      - "traefik.http.routers.playsrv.rule=PathPrefix(`/srv`)"
      - "traefik.http.routers.playsrv.tls=true"
      - "traefik.http.services.playsrv.loadbalancer.server.port=${PLAY_HTTP_PORT}"
      # KORREKTUR: Netzwerk-Name korrigiert von 'web' zu 'proxy'
      - "traefik.docker.network=proxy"
      
      # OPTIONAL: Falls die Play-App den Präfix "/srv" nicht kennt, 
      # schneidet diese Middleware ihn ab, bevor die Anfrage die App erreicht:
      - "traefik.http.routers.playsrv.middlewares=playsrv-strip"
      - "traefik.http.middlewares.playsrv-strip.stripprefix.prefixes=/srv"

      # KORREKTUR: YAML-Syntax für die restlichen Labels repariert
      - "MAINTAINER=${APP_MAINTAINER}"
      - "VENDOR=${APP_VENDOR}"
      - "IMAGE_DESCRIPTION=This Dockerfile creates an image with the PlayDemo App running on it."

    environment:
      APP_VERSION: ${APP_VERSION}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      APP_DATE: ${APP_DATE}   
      PLAY_LOGFILE_PATH: ${APP_HOME}/logs
      PLAY_PIDFILE_PATH: ${PLAY_PIDFILE_PATH}
      DB_DEFAULT_URL: ${DB_DEFAULT_URL}
      DB_DEFAULT_DRIVER: ${DB_DEFAULT_DRIVER}
      DB_DEFAULT_USERNAME: ${DB_DEFAULT_USERNAME}
      DB_DEFAULT_PASSWORD: ${DB_DEFAULT_PASSWORD}
      PLAY_WP_URL: ${PLAY_WP_URL}
      PLAY_WP_CPT: ${PLAY_WP_CPT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PLAY_HTTP_PORT: ${PLAY_HTTP_PORT}
      PLAY_HTTP_HOST: ${PLAY_HTTP_HOST}
      PLAY_HTTP_SECRET_KEY: ${PLAY_HTTP_SECRET_KEY}
      PLAY_MAILER_HOST: ${PLAY_MAILER_HOST}
      PLAY_MAILER_PORT: ${PLAY_MAILER_PORT}
      PLAY_MAILER_USER: ${PLAY_MAILER_USER}
      PLAY_MAILER_PASSWORD: ${PLAY_MAILER_PASSWORD}
      PLAY_MAILER_DEBUG: ${PLAY_MAILER_DEBUG}
      PLAY_MAILER_MOCK: ${PLAY_MAILER_MOCK}
    expose:
     - "${PLAY_HTTP_PORT}"
    volumes:
      - "./logs:${APP_HOME}/logs:rw"
    depends_on:
      - db
    networks:
      - proxy
      - backend

  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - ./wp_data:/app
    user: "${UID:-1000}:${GID:-1000}"
    profiles:
      - tools
    networks:
      - backend      

networks:
  proxy:
    name: proxy
  backend:
    name: backend