name: ${APP_NAME}

services:
  # Reverse Proxy (Traefik), der den HTTPS-Traffic (Port 443) verwaltet
  reverse-proxy:
    image: traefik:v3.6.2
    command:
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
    
      # Entrypoints definieren
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    
      # HTTP → HTTPS Umleitung
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Let's Encrypt ACME
      - "--certificatesresolvers.myresolver.acme.email=robert.lichenegger@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      # FEHLER KORRIGIERT: Muss auf den HTTP-Entrypoint 'web' verweisen
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # Zugriff auf Docker API
      - ./acme.json:/acme.json
    networks:
      - proxy

  wordpress:
    image: wp-gmp-image
    build:
      context: .
      dockerfile: wordpress/Dockerfile
    container_name: wp-gmp-instance
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'https://rolicht.de' );
        define( 'WP_SITEURL', 'https://rolicht.de' );
        define( 'PLAY_SERVER_URL', "${PLAY_SERVER_URL}" );
    expose:
      - "80"
    volumes:
      - ./wp_data:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      # HINWEIS: Let's Encrypt Resolver zugewiesen
      - "traefik.http.routers.wordpress.tls.certresolver=myresolver"
      - "traefik.http.routers.wordpress.rule=PathPrefix(`/`)"
      - "traefik.http.routers.wordpress.tls=true"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - backend

  wp-cli:
    image: wordpress:cli
    container_name: wp-cli-instance
    user: root
    volumes:
      - ./wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    depends_on:
      - db
    networks:
      - backend
    command: tail -f /dev/null

  db:
    image: mariadb:10.11
    container_name: wp-db-instance
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - backend

  playsrv:
    image: playsrv-image
    container_name: playsrv-instance
    build:
      context: .
      dockerfile: playsrv/Dockerfile
      args:
        - APP_HOME=${APP_HOME}
        - PLAY_WP_URL=${PLAY_WP_URL}
        - PLAY_WP_CPT=${PLAY_WP_CPT}
        - APP_VERSION=${APP_VERSION}
        - DEMON_USER=${DEMON_USER}
        - DEMON_USERID=${DEMON_USERID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.playsrv.entrypoints=websecure"
      # HINWEIS: Let's Encrypt Resolver zugewiesen
      - "traefik.http.routers.playsrv.tls.certresolver=myresolver"
      - "traefik.http.routers.playsrv.rule=PathPrefix(`/srv`)"
      - "traefik.http.routers.playsrv.tls=true"
      - "traefik.http.services.playsrv.loadbalancer.server.port=${PLAY_HTTP_PORT}"
      - "traefik.docker.network=proxy"
      
      # Middleware um /srv abzuschneiden
      - "traefik.http.routers.playsrv.middlewares=playsrv-strip"
      - "traefik.http.middlewares.playsrv-strip.stripprefix.prefixes=/srv"
      # KORREKTUR: Unnötige/fehlerhafte Image-Metadaten-Labels entfernt (Gehören ins Dockerfile)
    environment:
      APP_VERSION: ${APP_VERSION}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      APP_DATE: ${APP_DATE}   
      PLAY_LOGFILE_PATH: ${APP_HOME}/logs
      PLAY_PIDFILE_PATH: ${PLAY_PIDFILE_PATH}
      DB_DEFAULT_URL: ${DB_DEFAULT_URL}
      DB_DEFAULT_DRIVER: ${DB_DEFAULT_DRIVER}
      DB_DEFAULT_USERNAME: ${DB_DEFAULT_USERNAME}
      DB_DEFAULT_PASSWORD: ${DB_DEFAULT_PASSWORD}
      PLAY_WP_URL: ${PLAY_WP_URL}
      PLAY_WP_CPT: ${PLAY_WP_CPT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PLAY_HTTP_PORT: ${PLAY_HTTP_PORT}
      PLAY_HTTP_HOST: ${PLAY_HTTP_HOST}
      PLAY_HTTP_SECRET_KEY: ${PLAY_HTTP_SECRET_KEY}
      PLAY_MAILER_HOST: ${PLAY_MAILER_HOST}
      PLAY_MAILER_PORT: ${PLAY_MAILER_PORT}
      PLAY_MAILER_USER: ${PLAY_MAILER_USER}
      PLAY_MAILER_PASSWORD: ${PLAY_MAILER_PASSWORD}
      PLAY_MAILER_DEBUG: ${PLAY_MAILER_DEBUG}
      PLAY_MAILER_MOCK: ${PLAY_MAILER_MOCK}
    expose:
     - "${PLAY_HTTP_PORT}"
    volumes:
      - "./logs:${APP_HOME}/logs:rw"
    depends_on:
      - db
    networks:
      - proxy
      - backend 

networks:
  proxy:
    name: proxy
  backend:
    name: backend