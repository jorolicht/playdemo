@(slug: String, initialData: shared.model.Matchboard, initialDataJson: String)

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anzeigetafel@if(initialData.tourneyName.nonEmpty){ - @initialData.tourneyName}</title>
    <link href='@("https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap")' rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.7);
            --border-color: rgba(148, 163, 184, 0.15);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-glow: rgba(79, 70, 229, 0.08);
            --accent: #4f46e5;
            --accent-glow-green: rgba(16, 185, 129, 0.1);
            --success: #10b981;
            --info-bg: rgba(79, 70, 229, 0.05);
            --info-border: rgba(79, 70, 229, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Kopfleiste wie das Hauptmenü der App (navbar-custom #336699): Logo links, Turniername mittig, Uhr rechts */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 2rem;
            background-color: #336699;
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.25);
        }

        .topbar-left { display: flex; align-items: center; min-width: 0; }
        .topbar-logo { height: 52px; width: auto; max-width: 220px; object-fit: contain; }
        .topbar-logo.club { background: #ffffff; border-radius: 8px; padding: 4px; }

        .header-title {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60vw;
        }

        .topbar-right { display: flex; align-items: center; justify-content: flex-end; gap: 1.25rem; }
        .topbar .live-indicator { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); color: #e2e8f0; box-shadow: none; }
        .clock { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

        .content { padding: 2rem; flex: 1; }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-secondary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .live-dot.connected {
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 1.5s infinite;
        }

        @@keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* Info Section Styles */
        .info-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .info-card {
            background: var(--info-bg);
            border: 1px solid var(--info-border);
            border-radius: 16px;
            padding: 1.25rem 2rem;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.5;
            color: #3730a3;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.04);
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            text-align: center;
        }

        /* Match Grid Styles (List Row Layout) */
        .match-grid {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .match-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: rgba(79, 70, 229, 0.25);
            box-shadow: 0 12px 35px rgba(79, 70, 229, 0.08);
        }

        .match-left {
            display: flex;
            align-items: center;
            width: 150px;
            flex-shrink: 0;
        }

        .court-badge {
            background: rgba(79, 70, 229, 0.08);
            color: #4f46e5;
            border: 1px solid rgba(79, 70, 229, 0.2);
            padding: 6px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: 0.02em;
            text-align: center;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.04);
        }

        .match-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            flex-grow: 1;
        }

        .player-name {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }

        .vs-badge {
            font-size: 0.85rem;
            font-weight: 900;
            color: #a21caf;
            background: rgba(240, 73, 214, 0.08);
            border: 1px solid rgba(240, 73, 214, 0.2);
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .match-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 250px;
            flex-shrink: 0;
        }

        .comp-badge {
            background: rgba(71, 85, 105, 0.05);
            color: #475569;
            border: 1px solid rgba(71, 85, 105, 0.15);
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            max-width: 230px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }

        /* Animations */
        @@keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @@keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @@keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            font-size: 1.3rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.4);
            border: 1px dashed var(--border-color);
            border-radius: 20px;
            width: 100%;
        }

        /* Responsive Layout */
        @@media (max-width: 768px) {
            .content {
                padding: 1rem;
            }
            .topbar {
                padding: 0.5rem 1rem;
            }
            .topbar-logo {
                height: 36px;
            }
            .header-title, .clock {
                font-size: 1.3rem;
            }
            .topbar .live-indicator {
                display: none;
            }
            .match-card {
                flex-direction: column;
                gap: 1rem;
                padding: 1.5rem;
                align-items: stretch;
                text-align: center;
            }
            .match-left, .match-right {
                width: 100%;
                justify-content: center;
            }
            .match-center {
                flex-direction: column;
                gap: 0.5rem;
            }
            .comp-badge {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left"><img class="topbar-logo" id="mb-logo" alt="Logo"></div>
        <div class="header-title" id="tourney-name">@initialData.tourneyName</div>
        <div class="topbar-right">
            <div class="live-indicator">
                <span class="live-dot" id="ws-dot"></span>
                <span id="ws-status">Verbinde...</span>
            </div>
            <div class="clock" id="mb-clock" aria-label="Uhrzeit"></div>
        </div>
    </header>

    <main class="content">

    <!-- Info Announcments -->
    <div class="info-container" id="info-container">
        <!-- Rendered dynamically -->
    </div>

    <!-- Matchboard Grid -->
    <div class="match-grid" id="match-grid">
        <!-- Rendered dynamically -->
    </div>
    </main>

    <script>
        const slug = "@slug";
        const tourneyHeader = document.getElementById('tourney-name');
        const wsDot = document.getElementById('ws-dot');
        const wsStatus = document.getElementById('ws-status');
        const infoContainer = document.getElementById('info-container');
        const matchGrid = document.getElementById('match-grid');

        // Initial Data injected from server
        let currentData = {
            tourneyName: "@initialData.tourneyName",
            entries: []
        };

        // WordPress des Turniers: ?home=<url> (Link aus der App), sonst gleicher Host. Post-ID = Ende des Slugs ("…-769").
        const home = (new URLSearchParams(window.location.search).get('home') || window.location.origin).replace(/\/$/, '');
        const postId = (slug.match(/-(\d+)$/) || [])[1];
        let wpName = '';

        /** Turniername: aus WordPress, sonst der vom Client gemeldete Name. */
        function showName(name) {
            const n = wpName || name || '';
            tourneyHeader.textContent = n;
            document.title = n ? `Anzeigetafel - ${n}` : 'Anzeigetafel';
        }

        // Logo: Vereinslogo des Turniers (read-aci), sonst das Logo des Turnierprogramms
        const logo = document.getElementById('mb-logo');
        logo.onerror = () => { logo.style.visibility = 'hidden'; };
        logo.src = `${home}/wp-content/plugins/tourney/img/logo.png`;
        if (postId) {
            fetch(`${home}/wp-json/tourney/v1/read-aci?postId=${postId}`)
                .then(r => r.ok ? r.json() : null)
                .then(aci => { if (aci && aci.logoUrl) { logo.classList.add('club'); logo.style.visibility = ''; logo.src = aci.logoUrl; } })
                .catch(() => {});
            fetch(`${home}/wp-json/tourney/v1/read?postId=${postId}`)
                .then(r => r.ok ? r.json() : null)
                .then(d => { if (d && d.tourney && d.tourney.name) { wpName = d.tourney.name; showName(currentData.tourneyName); } })
                .catch(() => {});
        }

        // Uhr (HH:MM), jede Sekunde aktualisiert
        const clock = document.getElementById('mb-clock');
        function tick() { clock.textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }
        tick();
        setInterval(tick, 1000);

        // Render function
        function render(data) {
            showName(data.tourneyName);

            // Clear previous items
            infoContainer.innerHTML = '';
            matchGrid.innerHTML = '';

            const infoEntries = data.entries.filter(e => e.entryType === 'info');
            const matchEntries = data.entries.filter(e => e.entryType === 'start' || e.entryType === 'match');

            // Render Info Entries
            if (infoEntries.length > 0) {
                infoEntries.forEach(info => {
                    const card = document.createElement('div');
                    card.className = 'info-card';
                    card.textContent = info.text || '';
                    infoContainer.appendChild(card);
                });
            }

            // Render Match Entries
            if (matchEntries.length > 0) {
                matchEntries.forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-left">
                            <span class="court-badge">${match.court || ''}</span>
                        </div>
                        <div class="match-center">
                            <div class="player-name">${match.nameA || ''}</div>
                            <div class="vs-badge">VS</div>
                            <div class="player-name">${match.nameB || ''}</div>
                        </div>
                        <div class="match-right">
                            <span class="comp-badge" title="${match.compName || ''}">${match.compName || ''}</span>
                        </div>
                    `;
                    matchGrid.appendChild(card);
                });
            } else if (infoEntries.length === 0) {
                // Show empty state if absolutely nothing is displayed
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'Aktuell keine aktiven Spiele eingetragen.';
                matchGrid.appendChild(empty);
            }
        }

        // Establish WebSocket Connection
        let ws;
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const path = window.location.pathname;
            const isSrv = path.startsWith('/srv');
            const wsPath = isSrv ? `/srv/ws/${slug}` : `/ws/${slug}`;
            const wsUrl = `${protocol}//${host}${wsPath}`;

            wsStatus.textContent = 'Verbinde...';
            wsDot.className = 'live-dot';

            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                wsStatus.textContent = 'Live';
                wsDot.className = 'live-dot connected';
                // Send keep-alive ping periodically
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send('ping');
                    }
                }, 30000);
            };

            ws.onmessage = function(event) {
                if (event.data.startsWith('MATCHBOARD_UPDATE:')) {
                    try {
                        const jsonStr = event.data.substring(18);
                        const matchboard = JSON.parse(jsonStr);
                        currentData = matchboard;
                        render(matchboard);
                    } catch (e) {
                        console.error('Error parsing matchboard update', e);
                    }
                }
            };

            ws.onclose = function() {
                wsStatus.textContent = 'Getrennt';
                wsDot.className = 'live-dot';
                // Retry connection after 5 seconds
                setTimeout(connect, 5000);
            };
        }

        // Parse and render initial entries injected as JSON safely
        try {
            // Unescape HTML entities if injected by Play Framework twirl compiler
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = '@initialDataJson';
            const rawJson = tempDiv.textContent;
            currentData = JSON.parse(rawJson);
            render(currentData);
        } catch (e) {
            console.error('Error parsing initial data', e);
            render(currentData);
        }

        // Start WebSocket
        connect();
    </script>
</body>
</html>
